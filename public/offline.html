<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline / Hors ligne | Training Platform</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --surface: #ffffff;
        --border: #e4e4e7;
        --text: #18181b;
        --text-muted: #71717a;
        --primary: #dc2626;
        --primary-hover: #b91c1c;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --surface: #18181b;
          --border: #27272a;
          --text: #fafafa;
          --text-muted: #a1a1aa;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background-color: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }

      .card {
        max-width: 28rem;
      }

      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3.25rem;
        height: 3.25rem;
        border-radius: 0.75rem;
        background-color: var(--primary);
        color: #fff;
        margin-bottom: 1.5rem;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }

      p {
        color: var(--text-muted);
        font-size: 0.9rem;
        line-height: 1.55;
        margin: 0 0 1.25rem;
      }

      .lang-block + .lang-block {
        padding-top: 1.25rem;
        border-top: 1px solid var(--border);
        margin-top: 0.25rem;
      }

      a.retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.75rem 1.5rem;
        border-radius: 0.625rem;
        background-color: var(--primary);
        color: #fff;
        font-weight: 500;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }

      a.retry:hover {
        background-color: var(--primary-hover);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 8.82a15 15 0 0 1 20 0" />
          <path d="M5 12.859a10 10 0 0 1 14 0" />
          <path d="M8.5 16.429a5 5 0 0 1 7 0" />
          <path d="M12 20h.01" />
          <line x1="2" y1="2" x2="22" y2="22" />
        </svg>
      </span>
      <div class="lang-block">
        <h1>You&apos;re offline</h1>
        <p>This page hasn&apos;t been saved for offline use yet. Reconnect and try again.</p>
      </div>
      <div class="lang-block">
        <h1>Vous êtes hors ligne</h1>
        <p>
          Cette page n&apos;a pas encore été enregistrée pour une utilisation hors ligne.
          Reconnectez-vous et réessayez.
        </p>
      </div>
      <a class="retry" href="/">Try again / Réessayer</a>
    </div>
  </body>
</html>
