<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 - Page not found | Training Platform</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --surface: #ffffff;
        --border: #e4e4e7;
        --text: #18181b;
        --text-muted: #71717a;
        --primary: #dc2626;
        --primary-hover: #b91c1c;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --surface: #18181b;
          --border: #27272a;
          --text: #fafafa;
          --text-muted: #a1a1aa;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background-color: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }

      .card {
        max-width: 26rem;
      }

      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3.25rem;
        height: 3.25rem;
        border-radius: 0.75rem;
        background-color: var(--primary);
        color: #fff;
        margin-bottom: 1.5rem;
      }

      .code {
        font-size: 3rem;
        font-weight: 700;
        color: var(--primary);
        line-height: 1;
        margin: 0 0 0.5rem;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }

      p {
        color: var(--text-muted);
        font-size: 0.9rem;
        line-height: 1.55;
        margin: 0 0 1.75rem;
      }

      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.75rem 1.5rem;
        border-radius: 0.625rem;
        background-color: var(--primary);
        color: #fff;
        font-weight: 500;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }

      a.button:hover {
        background-color: var(--primary-hover);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/>
          <path d="M22 10v6"/>
          <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
        </svg>
      </span>
      <p class="code">404</p>
      <h1>This page doesn&apos;t exist</h1>
      <p>The link may be broken, or the page may have moved. Check the address, or head back to the app.</p>
      <a class="button" href="/">Go to Training Platform</a>
    </div>
  </body>
</html>
