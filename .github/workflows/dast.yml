name: DAST

on:
  workflow_call:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: zap-baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project

      - name: Build production bundle
        run: npm run build

      - name: Serve the build
        run: npx vite preview --port 4173 --host &

      - name: Wait for the preview server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173 > /dev/null && exit 0
            sleep 1
          done
          echo "preview server never came up" >&2
          exit 1

      - name: ZAP baseline scan (report only for now)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:4173"
          cmd_options: "-a"
          fail_action: false
          allow_issue_writing: false
